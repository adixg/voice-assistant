# Kokoro (PyTorch, voice af_bella) on the GTX 1650, used while the card has
# nothing else to do. controller/gpu_scheduler owns it: once the RTX 4060 has
# served the LLM stably and the 1650's standby LLM has left the card, it scales
# this to 1 and, when ready, points the `tts` Service here (tts.yaml); on any
# loss of the 4060 it points the Service back at the CPU `tts` pod (Kitten,
# always running) and scales this to 0 in the same pass that starts the
# standby, so the LLM gets the card.
#
# Measured on the 1650 (benchmarks/runs/tts_engines/, 2026-11-10): 22x
# realtime against Kitten's 3.4x on CPU, ~1 GB of VRAM (whole card), ~2 GB
# process RAM. Its voice can't be switched at runtime (set_voice answers 409
# while this pod serves); to keep TTS on the CPU always:
#   kubectl -n aicompanion annotate deployment tts-gpu aicompanion/gpu-tts=off
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tts-gpu
  namespace: aicompanion
spec:
  # No `replicas:` on purpose: the controller owns it (a manifest value would
  # be re-applied over its decision).
  strategy:
    type: Recreate  # one copy on the card at a time
  selector:
    matchLabels:
      app: tts-gpu
  template:
    metadata:
      labels:
        app: tts-gpu
    spec:
      nodeSelector:
        gpu-tier: gtx1650
      runtimeClassName: nvidia
      priorityClassName: voice-critical
      containers:
        - name: tts
          image: ghcr.io/adixg/aicompanion-tts-kokoro:latest
          imagePullPolicy: IfNotPresent
          args: ["--tts-backend", "kokoro", "--kokoro-voice", "af_bella", "--kokoro-language", "a",
                 "--kokoro-device", "cuda"]
          # 2,064 MiB peak RSS in the benchmark; the request is what the node
          # reserves, and the standby LLM's 1 GiB request is free whenever
          # this runs.
          resources:
            requests: {memory: 1536Mi}
            limits: {memory: 3Gi, nvidia.com/gpu: 1}
          env:
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: tempo:4317}
            - {name: HF_HOME, value: /models/hf}
          ports:
            - {containerPort: 8003, name: metrics}
          volumeMounts:
            - {name: hf-cache, mountPath: /models/hf}
          # Ready only once the model is loaded (the backend is built before
          # the server starts), so the controller never routes to a cold pod.
          readinessProbe:
            httpGet: {path: /health, port: 8003}
            initialDelaySeconds: 10
      volumes:
        # Kokoro's weights and voice pack, downloaded once (~330 MB).
        - name: hf-cache
          hostPath:
            path: /var/lib/aicompanion/tts-gpu-hf
            type: DirectoryOrCreate
